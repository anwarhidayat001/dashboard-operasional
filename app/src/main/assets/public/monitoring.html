<html lang="id">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">-->
    <link href="css/templatemo-neural-style.css" rel="stylesheet">
    <title>CeisMon - Monitoring Grafik</title>
    <style>
        /* Additional styles untuk monitoring dashboard */
        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .info-item label {
            display: block;
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-item span {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--card-text);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4CAF50;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        .status-indicator.error {
            background-color: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 12px 28px;
            border: 2px solid transparent;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: var(--card-bg);
            color: var(--card-text);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .chart-container, .table-container {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .chart-container h2, .table-container h2 {
            color: var(--card-text);
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: var(--hover-bg);
            border-radius: 10px;
            padding: 15px;
        }

        .line-chart {
            min-width: 100%;
            justify-content: center;
        }

        /* SVG Chart Styles */
        svg {
            overflow: visible;
        }

        .chart-line {
            fill: none;
            stroke-width: 3;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .chart-dot {
            fill: var(--card-bg);
            stroke-width: 2;
            transition: r 0.2s ease;
            cursor: pointer;
        }

        .chart-dot:hover {
            r: 6 !important;
        }

        .chart-grid {
            stroke: var(--border-color);
            stroke-width: 1;
            opacity: 0.5;
        }

        .chart-axis {
            stroke: var(--text-secondary);
            stroke-width: 2;
        }

        .chart-label {
            font-size: 12px;
            fill: var(--text-secondary);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: var(--card-text);
            padding: 5px 12px;
            background: var(--hover-bg);
            border-radius: 15px;
            ursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
        }
        
        .legend-item.hidden span {
    text-decoration: line-through;
    opacity: 0.5;
}

.legend-item.hidden .legend-color {
    opacity: 0.4;
}

        .legend-color {
            width: 25px;
            height: 4px;
            border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        tr:hover {
            background-color: var(--hover-bg);
        }

        td {
            color: var(--card-text);
        }

        .value-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 3px;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #c62828;
            box-shadow: 0 4px 15px rgba(198, 40, 40, 0.2);
        }

        [data-theme="dark"] .error-message {
            background: rgba(198, 40, 40, 0.2);
            color: #ff8a80;
            border-left-color: #ff8a80;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .info-bar {
                grid-template-columns: 1fr;
            }

            .category-buttons {
                gap: 8px;
            }

            .category-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .chart-wrapper {
                height: 300px;
            }
        }
        
        .range-buttons { display:flex; gap:8px; margin-bottom:15px; justify-content:flex-end; align-items:center; }
.range-buttons label { color:var(--text-secondary); font-size:0.85em; font-weight:600; }
.range-btn { padding:6px 14px; border:2px solid var(--border-color); border-radius:20px; cursor:pointer; font-size:0.85em; font-weight:600; background:var(--card-bg); color:var(--card-text); transition:all 0.2s; }
.range-btn:hover { border-color:#667eea; color:#667eea; }
.range-btn.active { background:linear-gradient(135deg,#667eea,#764ba2); color:white; border-color:transparent; }
    </style>
</head>
